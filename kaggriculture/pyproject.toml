[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kaggriculture-lab"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["jsonschema==4.26.0", "requests==2.34.2", "numpy==2.5.3", "PyYAML==6.0.3"]

[project.optional-dependencies]
test = ["pytest==9.1.1"]
distributed = ["ray==2.58.0"]
# The CUDA wheel is intentionally installed in a separate per-machine Linux venv from
# requirements-ml.lock.  Its index/version are part of the Pascal GPU contract;
# the main Ray/match environment stays minimal.

[tool.setuptools.packages.find]
include = ["agent*", "arena*", "eval*", "experiments*", "submission*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# tmp_path must resolve under ROOT or test_public_base_tournament.py trips
# validate_entry's path-containment guard. Also sidesteps a locked-down
# default temp dir on some Windows setups.
addopts = "--basetemp=.tmp"
